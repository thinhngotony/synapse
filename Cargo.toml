[package]
name = "synapse"
version = "1.2.0"
edition = "2021"
rust-version = "1.78"
authors = ["Synapse Contributors"]
description = "Portable AI harness installer, stack restore, and auto-updater"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
age = "=0.12.1"
rpassword = "=7.5.0"

[dev-dependencies]
tempfile = "3.8"
